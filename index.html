<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geekzone Rivas — Control de Reparaciones</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');

  :root{
    --bg:#0a0a0c;
    --bg-panel:#121216;
    --bg-field:#17171b;
    --red:#ff1e2d;
    --ink:#eceef0;
    --muted:#8b8e94;
    --line:#232327;
    --ok:#2fbf71;
    --warn:#e0a52e;
    --info:#3d8bff;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', system-ui, sans-serif;
    line-height:1.5;
    min-height:100vh;
  }

  h1,h2,h3,.mono-label{font-family:'Rajdhani', sans-serif;}

  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:22px 5vw;
    border-bottom:1px solid var(--line);
    flex-wrap:wrap;
    gap:14px;
  }
  header img{height:30px;}
  header .subtitle{
    font-family:'Rajdhani', sans-serif;
    font-weight:600;
    letter-spacing:.08em;
    font-size:13px;
    color:var(--muted);
  }

  main{padding:40px 5vw 80px; max-width:1400px; margin:0 auto;}

  /* ---------- summary ---------- */
  .summary{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:1px;
    background:var(--line);
    border:1px solid var(--line);
    margin-bottom:34px;
  }
  .summary .card{
    background:var(--bg-panel);
    padding:20px 22px;
  }
  .summary .card .n{
    font-family:'Rajdhani', sans-serif;
    font-size:32px;
    font-weight:700;
  }
  .summary .card .l{
    color:var(--muted);
    font-size:12.5px;
    letter-spacing:.03em;
    margin-top:2px;
  }
  .summary .card.recibida .n{color:var(--info);}
  .summary .card.diagnostico .n{color:var(--warn);}
  .summary .card.reparacion .n{color:var(--red);}
  .summary .card.lista .n{color:var(--ok);}

  /* ---------- form ---------- */
  .panel{
    background:var(--bg-panel);
    border:1px solid var(--line);
    padding:26px 28px 30px;
    margin-bottom:34px;
  }
  .panel h2{font-size:19px; font-weight:600; margin-bottom:18px;}

  form{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:16px;
  }
  form .full{grid-column:1 / -1;}

  label{
    display:block;
    font-size:12.5px;
    color:var(--muted);
    margin-bottom:6px;
  }
  input, select, textarea{
    width:100%;
    background:var(--bg-field);
    border:1px solid var(--line);
    color:var(--ink);
    padding:10px 12px;
    font-family:'Inter', sans-serif;
    font-size:14px;
    outline:none;
  }
  input:focus, select:focus, textarea:focus{border-color:var(--red);}
  textarea{resize:vertical; min-height:60px;}

  .form-actions{
    grid-column:1 / -1;
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-top:4px;
  }

  .btn{
    font-family:'Rajdhani', sans-serif;
    font-weight:600;
    font-size:15px;
    padding:11px 26px;
    border:1px solid var(--line);
    background:transparent;
    color:var(--ink);
    cursor:pointer;
    clip-path:polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
  }
  .btn-solid{background:var(--red); border-color:var(--red); color:#140404;}
  .btn-solid:hover{background:#ff3d4a;}
  .btn:hover{border-color:var(--red);}
  .btn-ghost{border-color:transparent; color:var(--muted); padding:6px 10px;}
  .btn-ghost:hover{color:var(--red);}

  /* ---------- table ---------- */
  .table-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:14px;
    gap:12px;
    flex-wrap:wrap;
  }
  .table-head h2{font-size:19px; font-weight:600;}
  .filters{display:flex; gap:8px; flex-wrap:wrap;}
  .filters select, .filters input{width:auto; min-width:150px;}

  .table-wrap{
    border:1px solid var(--line);
    overflow-x:auto;
  }
  table{width:100%; border-collapse:collapse; min-width:920px;}
  thead th{
    text-align:left;
    font-family:'Rajdhani', sans-serif;
    font-size:12.5px;
    letter-spacing:.04em;
    color:var(--muted);
    font-weight:600;
    padding:12px 14px;
    background:var(--bg-panel);
    border-bottom:1px solid var(--line);
    white-space:nowrap;
  }
  tbody td{
    padding:14px;
    border-bottom:1px solid var(--line);
    font-size:14px;
    vertical-align:top;
  }
  tbody tr:hover{background:var(--bg-panel);}
  tbody tr:last-child td{border-bottom:none;}

  .console-name{font-weight:600;}
  .client{color:var(--muted); font-size:12.5px; margin-top:2px;}

  .badge{
    display:inline-block;
    font-family:'Rajdhani', sans-serif;
    font-size:12px;
    font-weight:600;
    letter-spacing:.03em;
    padding:4px 10px;
    border:1px solid currentColor;
  }
  .badge.recibida{color:var(--info);}
  .badge.diagnostico{color:var(--warn);}
  .badge.reparacion{color:var(--red);}
  .badge.lista{color:var(--ok);}
  .badge.entregada{color:var(--muted);}

  select.status-select{
    font-size:12.5px;
    padding:6px 8px;
  }

  .diag-text{
    max-width:220px;
    color:var(--muted);
    font-size:13px;
    white-space:pre-wrap;
  }

  .row-actions{display:flex; gap:6px;}

  .empty-row td{
    text-align:center;
    color:var(--muted);
    padding:40px 14px;
  }

  .conn-status{
    display:none;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:11px 16px;
    margin-bottom:22px;
    font-size:13px;
    border:1px solid var(--line);
  }
  .conn-status.show{display:flex;}
  .conn-status.loading{color:var(--muted); border-color:var(--line);}
  .conn-status.error{color:var(--red); border-color:var(--red); background:rgba(255,30,45,.07);}
  .conn-status button{
    font-family:'Rajdhani', sans-serif;
    font-weight:600;
    font-size:12.5px;
    background:transparent;
    border:1px solid currentColor;
    color:inherit;
    padding:5px 12px;
    cursor:pointer;
  }

  @media (max-width:760px){
    form{grid-template-columns:1fr;}
    .summary{grid-template-columns:1fr 1fr;}
  }
</style>
</head>
<body>

<header>
  <img src="assets/logo.png" alt="Geekzone Rivas">
  <div class="subtitle">CONTROL DE REPARACIONES</div>
</header>

<main>

  <div class="conn-status" id="conn-status"><span id="conn-status-text"></span><button type="button" id="conn-retry" style="display:none;">Reintentar</button></div>

  <div class="summary" id="summary">
    <div class="card recibida"><div class="n" id="count-recibida">0</div><div class="l">Recibidas</div></div>
    <div class="card diagnostico"><div class="n" id="count-diagnostico">0</div><div class="l">En diagnóstico</div></div>
    <div class="card reparacion"><div class="n" id="count-reparacion">0</div><div class="l">En reparación</div></div>
    <div class="card lista"><div class="n" id="count-lista">0</div><div class="l">Listas para entrega</div></div>
  </div>

  <div class="panel">
    <h2>Registrar consola</h2>
    <form id="form-consola">
      <div>
        <label for="cliente">Cliente</label>
        <input type="text" id="cliente" required placeholder="Nombre del cliente">
      </div>
      <div>
        <label for="telefono">Teléfono</label>
        <input type="text" id="telefono" placeholder="8888-8888">
      </div>
      <div>
        <label for="consola">Consola / modelo</label>
        <input type="text" id="consola" required placeholder="PS4 Slim, Xbox One, etc.">
      </div>
      <div>
        <label for="fecha-ingreso">Fecha de ingreso</label>
        <input type="date" id="fecha-ingreso" required>
      </div>
      <div>
        <label for="fecha-entrega">Fecha estimada de entrega</label>
        <input type="date" id="fecha-entrega">
      </div>
      <div>
        <label for="estado">Estado</label>
        <select id="estado">
          <option value="recibida">Recibida</option>
          <option value="diagnostico">En diagnóstico</option>
          <option value="reparacion">En reparación</option>
          <option value="lista">Lista para entrega</option>
          <option value="entregada">Entregada</option>
        </select>
      </div>
      <div class="full">
        <label for="falla">Falla reportada por el cliente</label>
        <textarea id="falla" placeholder="Ej: no enciende, sobrecalentamiento, no lee discos..."></textarea>
      </div>
      <div class="full">
        <label for="diagnostico">Diagnóstico / notas técnicas</label>
        <textarea id="diagnostico" placeholder="Se completa al revisar el equipo"></textarea>
      </div>
      <div class="form-actions">
        <button type="button" class="btn" id="btn-cancelar-edit" style="display:none;">Cancelar edición</button>
        <button type="submit" class="btn btn-solid" id="btn-guardar">Guardar consola</button>
      </div>
    </form>
  </div>

  <div class="table-head">
    <h2>Consolas registradas</h2>
    <div class="filters">
      <input type="text" id="buscar" placeholder="Buscar cliente o consola...">
      <select id="filtro-estado">
        <option value="">Todos los estados</option>
        <option value="recibida">Recibida</option>
        <option value="diagnostico">En diagnóstico</option>
        <option value="reparacion">En reparación</option>
        <option value="lista">Lista para entrega</option>
        <option value="entregada">Entregada</option>
      </select>
    </div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Consola / Cliente</th>
          <th>Falla reportada</th>
          <th>Diagnóstico</th>
          <th>Ingreso</th>
          <th>Entrega</th>
          <th>Estado</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tabla-body">
      </tbody>
    </table>
  </div>

</main>

<script>
  // URL de la aplicación web desplegada en Apps Script (Implementar > Nueva implementación > Aplicación web)
  const API_URL = "https://script.google.com/macros/s/AKfycbzY8Waa_gyvyJe84GgkupZwhzoSpZhfg-rygz1oX69hzH4gY3dUoHy0HXxishoUJXkzCQ/exec";

  let editingId = null;
  let cachedData = [];

  function setStatus(mode, text){
    const bar = document.getElementById('conn-status');
    const label = document.getElementById('conn-status-text');
    const retry = document.getElementById('conn-retry');
    bar.classList.remove('loading', 'error');
    if(mode === 'hidden'){
      bar.classList.remove('show');
      return;
    }
    bar.classList.add('show', mode);
    label.textContent = text;
    retry.style.display = mode === 'error' ? 'inline-block' : 'none';
  }

  // Envuelve fetch para lanzar un error legible si la respuesta HTTP o el
  // JSON devuelto por Apps Script indican que algo falló.
  async function callApi(options){
    const res = await fetch(API_URL, options);
    if(!res.ok){
      throw new Error(`El servidor respondió con estado ${res.status}`);
    }
    let json;
    try{
      json = await res.json();
    }catch(e){
      throw new Error('La respuesta no tiene un formato JSON válido');
    }
    if(json && json.success === false){
      throw new Error(json.error || 'La operación fue rechazada por el servidor');
    }
    return json;
  }

  async function fetchData(){
    setStatus('loading', 'Conectando con Google Sheets...');
    try{
      const json = await callApi({ method: 'GET' });
      cachedData = json.data || [];
      setStatus('hidden');
      return cachedData;
    }catch(e){
      console.error('No se pudo conectar a Google Sheets', e);
      setStatus('error', 'No se pudo conectar con Google Sheets: ' + e.message);
      return cachedData;
    }
  }

  // Devuelve true/false para que quien llame sepa si realmente se guardó,
  // en vez de asumir éxito y refrescar el formulario igual.
  async function createOrUpdate(record){
    try {
      await callApi({
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        redirect: 'follow',
        body: JSON.stringify({ action: editingId ? 'update' : 'create', record })
      });
      return true;
    } catch(e) {
      console.error('Error al guardar el registro:', e);
      alert('No se pudo guardar en Google Sheets: ' + e.message);
      return false;
    }
  }

  async function deleteRecord(id){
    try {
      await callApi({
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        redirect: 'follow',
        body: JSON.stringify({ action: 'delete', id })
      });
      return true;
    } catch(e) {
      console.error('Error al eliminar el registro:', e);
      alert('No se pudo eliminar en Google Sheets: ' + e.message);
      return false;
    }
  }

  const estadoLabels = {
    recibida: 'Recibida',
    diagnostico: 'En diagnóstico',
    reparacion: 'En reparación',
    lista: 'Lista para entrega',
    entregada: 'Entregada'
  };

  function formatFecha(f){
    if(!f) return '—';
    const [y,m,d] = f.split('-');
    return `${d}/${m}/${y}`;
  }

  async function render(){
    const data = await fetchData();
    const search = document.getElementById('buscar').value.trim().toLowerCase();
    const filtroEstado = document.getElementById('filtro-estado').value;

    const filtered = data.filter(item=>{
      const matchesSearch = !search ||
        item.cliente.toLowerCase().includes(search) ||
        item.consola.toLowerCase().includes(search);
      const matchesEstado = !filtroEstado || item.estado === filtroEstado;
      return matchesSearch && matchesEstado;
    });

    const tbody = document.getElementById('tabla-body');
    tbody.innerHTML = '';

    if(filtered.length === 0){
      tbody.innerHTML = `<tr class="empty-row"><td colspan="7">No hay consolas registradas todavía.</td></tr>`;
    } else {
      filtered
        .slice()
        .sort((a,b)=> (b.fechaIngreso || '').localeCompare(a.fechaIngreso || ''))
        .forEach(item=>{
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>
              <div class="console-name">${escapeHtml(item.consola)}</div>
              <div class="client">${escapeHtml(item.cliente)}${item.telefono ? ' · ' + escapeHtml(item.telefono) : ''}</div>
            </td>
            <td class="diag-text">${escapeHtml(item.falla) || '—'}</td>
            <td class="diag-text">${escapeHtml(item.diagnostico) || '—'}</td>
            <td>${formatFecha(item.fechaIngreso)}</td>
            <td>${formatFecha(item.fechaEntrega)}</td>
            <td>
              <select class="status-select badge ${item.estado}" data-id="${item.id}">
                ${Object.entries(estadoLabels).map(([val,label])=>
                  `<option value="${val}" ${val===item.estado?'selected':''}>${label}</option>`
                ).join('')}
              </select>
            </td>
            <td>
              <div class="row-actions">
                <button class="btn-ghost" data-action="edit" data-id="${item.id}">Editar</button>
                <button class="btn-ghost" data-action="delete" data-id="${item.id}">Eliminar</button>
              </div>
            </td>
          `;
          tbody.appendChild(tr);
        });
    }

    document.querySelectorAll('.status-select').forEach(sel=>{
      sel.addEventListener('change', async (e)=>{
        const id = e.target.dataset.id;
        const item = cachedData.find(d=>d.id === id);
        if(item){
          const previo = item.estado;
          item.estado = e.target.value;
          const ok = await createOrUpdate(item);
          if(!ok) item.estado = previo;
          render();
        }
      });
    });

    document.querySelectorAll('[data-action="delete"]').forEach(btn=>{
      btn.addEventListener('click', async (e)=>{
        const id = e.target.dataset.id;
        if(confirm('¿Eliminar este registro?')){
          await deleteRecord(id);
          render();
        }
      });
    });

    document.querySelectorAll('[data-action="edit"]').forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        const id = e.target.dataset.id;
        const item = cachedData.find(d=>d.id === id);
        if(item) startEdit(item);
      });
    });

    updateSummary(data);
  }

  function updateSummary(data){
    const counts = { recibida:0, diagnostico:0, reparacion:0, lista:0 };
    data.forEach(d=>{ if(counts[d.estado] !== undefined) counts[d.estado]++; });
    document.getElementById('count-recibida').textContent = counts.recibida;
    document.getElementById('count-diagnostico').textContent = counts.diagnostico;
    document.getElementById('count-reparacion').textContent = counts.reparacion;
    document.getElementById('count-lista').textContent = counts.lista;
  }

  function escapeHtml(str){
    if(!str) return '';
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function startEdit(item){
    editingId = item.id;
    document.getElementById('cliente').value = item.cliente;
    document.getElementById('telefono').value = item.telefono || '';
    document.getElementById('consola').value = item.consola;
    document.getElementById('fecha-ingreso').value = item.fechaIngreso || '';
    document.getElementById('fecha-entrega').value = item.fechaEntrega || '';
    document.getElementById('estado').value = item.estado;
    document.getElementById('falla').value = item.falla || '';
    document.getElementById('diagnostico').value = item.diagnostico || '';
    document.getElementById('btn-guardar').textContent = 'Guardar cambios';
    document.getElementById('btn-cancelar-edit').style.display = 'inline-block';
    window.scrollTo({top:0, behavior:'smooth'});
  }

  function resetForm(){
    editingId = null;
    document.getElementById('form-consola').reset();
    document.getElementById('btn-guardar').textContent = 'Guardar consola';
    document.getElementById('btn-cancelar-edit').style.display = 'none';
  }

  document.getElementById('btn-cancelar-edit').addEventListener('click', resetForm);

  document.getElementById('form-consola').addEventListener('submit', async (e)=>{
    e.preventDefault();

    const record = {
      id: editingId || Date.now().toString(36) + Math.random().toString(36).slice(2,6),
      cliente: document.getElementById('cliente').value.trim(),
      telefono: document.getElementById('telefono').value.trim(),
      consola: document.getElementById('consola').value.trim(),
      fechaIngreso: document.getElementById('fecha-ingreso').value,
      fechaEntrega: document.getElementById('fecha-entrega').value,
      estado: document.getElementById('estado').value,
      falla: document.getElementById('falla').value.trim(),
      diagnostico: document.getElementById('diagnostico').value.trim()
    };

    const btnGuardar = document.getElementById('btn-guardar');
    const textoOriginal = btnGuardar.textContent;
    btnGuardar.textContent = 'Guardando...';
    btnGuardar.disabled = true;

    const ok = await createOrUpdate(record);

    btnGuardar.disabled = false;
    if(ok){
      resetForm();
      render();
    } else {
      btnGuardar.textContent = textoOriginal;
    }
  });

  document.getElementById('conn-retry').addEventListener('click', render);

  document.getElementById('buscar').addEventListener('input', render);
  document.getElementById('filtro-estado').addEventListener('change', render);

  // fecha de ingreso por defecto: hoy
  document.getElementById('fecha-ingreso').valueAsDate = new Date();

  document.getElementById('tabla-body').innerHTML =
    '<tr class="empty-row"><td colspan="7">Cargando registros...</td></tr>';
  render();
</script>

</body>
</html>
